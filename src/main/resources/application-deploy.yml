server:
  address: 0.0.0.0
  port: ${PORT:8083}

spring:
  datasource:
    url: ${DATABASE_URI}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      url: ${REDIS_URL}

  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

app:
  frontend-url: ${FRONTEND_URL}

resilience4j:
  ratelimiter:
    instances:
      login:
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0

      register:
        limit-for-period: 3
        limit-refresh-period: 1m
        timeout-duration: 0

      api:
        limit-for-period: 30
        limit-refresh-period: 10s
        timeout-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health


brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}