server:
  address: 0.0.0.0
  port: ${PORT:8083}

spring:
  datasource:
    url: ${DATABASE_URI}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_EMAIL}
    password: ${GOOGLE_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      url: ${REDIS_URL}

  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

app:
  frontend-url: ${FRONTEND_URL}

resilience4j:
  ratelimiter:
    instances:
      login:
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0

      register:
        limit-for-period: 3
        limit-refresh-period: 1m
        timeout-duration: 0

      api:
        limit-for-period: 30
        limit-refresh-period: 10s
        timeout-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
